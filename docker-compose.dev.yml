# Postgres and RustFS, for running the app from source. `npm run db:up`.
#
# Its own project name, so it never collides with the containers
# docker-compose.yml creates — both files define `postgres` and `rustfs`.
name: engrafo-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: engrafo
      POSTGRES_PASSWORD: engrafo
      POSTGRES_DB: engrafo
    ports:
      # Loopback by default: an unencrypted Postgres with a throwaway password
      # has no business on a network. Override DEV_BIND to 0.0.0.0 when the
      # Docker daemon is not this machine (`docker context ls` shows a remote
      # endpoint) — the loopback it binds is the daemon host's, not yours.
      - "${DEV_BIND:-127.0.0.1}:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - engrafo_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engrafo -d engrafo"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: engrafo
      RUSTFS_SECRET_KEY: engrafo-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
      # RustFS sends no CORS headers unless told to, and a presigned browser PUT
      # is cross-origin by construction: the page is on one port, the bucket on
      # another. The signed URL is the credential, so any origin may use one.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      # Empty means stdout. The image's default is a file inside the container,
      # where `docker logs` shows nothing and nothing rotates it.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      # The browser PUTs uploads straight here, so unlike Postgres this port has
      # to be reachable from wherever the app is opened. Same DEV_BIND rule.
      - "${DEV_BIND:-127.0.0.1}:${RUSTFS_PORT:-9000}:9000"
      - "${DEV_BIND:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - engrafo_dev_rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates both buckets, then exits — files in one, extracted text in the
  # other.
  rustfs-init:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      sh -c "rc alias set local http://rustfs:9000 engrafo engrafo-dev-secret &&
             rc bucket create --ignore-existing local/engrafo &&
             rc bucket create --ignore-existing local/engrafo-text"
    restart: "no"

volumes:
  engrafo_dev_pgdata:
  engrafo_dev_rustfs:
