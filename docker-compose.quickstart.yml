# Engrafo, for self-hosting. Paste this whole file into Portainer (Stacks → Add
# stack → Web editor), TrueNAS SCALE (Apps → Discover → Custom App → Install via
# YAML), Dokge, or run it with `docker compose -f docker-compose.quickstart.yml up -d`.
#
# It pulls a published image — nothing to clone and nothing to build.
#
# Set these five variables.
# In Portainer they go in the stack's "Environment variables" box; with the
# docker CLI, in a `.env` file beside this one. The stack refuses to start until
# the three secrets are set, which is deliberate.
#
#   ENGRAFO_HOST      The address you will actually open Engrafo at — your NAS's
#                     hostname or LAN IP, no scheme. e.g. truenas.local, 192.168.1.50
#   BETTER_AUTH_SECRET openssl rand -hex 32
#   POSTGRES_PASSWORD openssl rand -hex 24
#   RUSTFS_PASSWORD   openssl rand -hex 24
#   TZ                optional, e.g. America/Chicago
#
# Optional, if something on this machine already owns those ports — 9000 in
# particular is popular. Change them here rather than editing the file, because
# the addresses Engrafo signs its upload URLs with are built from them:
#
#   ENGRAFO_PORT=3004  RUSTFS_PORT=9000  RUSTFS_CONSOLE_PORT=9001
#
# ENGRAFO_HOST is the one people get wrong. Your browser uploads files straight
# to RustFS using a link Engrafo signs, and the signature covers the hostname —
# so if this says "localhost" while you are browsing from another machine,
# uploads fail with a signature error rather than a DNS one.
#
# After it starts.
# Open http://ENGRAFO_HOST:3004 and sign in with any email address. Engrafo
# sends no mail: the sign-in link is written to the container log, and that is
# how you get it.
#
#   docker logs -f engrafo        (or the Logs tab in Portainer)
#
# On a home network that is tedious. SECURE_LOCAL_NET=true skips the link
# entirely — an address alone signs you in. Read the warning beside it below.
#
# Or sign in through an OpenID Connect provider such as heautou. The easy way:
# make a setup URL for Engrafo in heautou and paste it into the login page's
# "Set up sign-in" tab before anyone has an account (or, later, Settings ->
# Sign-in, as the first account created). No variables needed. To pin the
# provider instead, register a client there whose redirect URI is
# http://ENGRAFO_HOST:3004/api/auth/callback/oidc, then set OIDC_ISSUER,
# OIDC_CLIENT_ID, OIDC_CLIENT_SECRET and, for the button, OIDC_NAME. The login
# page then shows "Sign in with <OIDC_NAME>".
#
# Registration is open to anyone who can reach the page, so keep this on a
# network you trust, or put a reverse proxy with real auth in front of it.
# Read the "Before you expose it" section of the README before giving it a
# domain.
#
# Upgrading a stack made from an older copy of this file: document search needs
# Postgres with pgvector, so the postgres service's image is now
# pgvector/pgvector:pg17 instead of postgres:17-alpine. Paste this file again,
# or change that one line, and redeploy. The data volume is kept as it is.
# Without it the engrafo container stops at boot and its log says so.

name: engrafo

services:
  engrafo:
    image: vantreeseba/engrafo:latest
    container_name: engrafo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET — openssl rand -hex 32}
      DATABASE_URL: postgres://engrafo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/engrafo
      # The address sign-in links are built from.
      APP_URL: http://${ENGRAFO_HOST:?set ENGRAFO_HOST to this machine's hostname or LAN IP}:${ENGRAFO_PORT:-3004}
      # How the server reaches RustFS: over the stack's own network, where the
      # published port does not apply.
      S3_ENDPOINT: http://rustfs:9000
      # How your browser reaches RustFS. Signed into every upload and download
      # link, so it must be an address your browser can actually resolve —
      # host and port both, because the signature covers them.
      S3_PUBLIC_ENDPOINT: http://${ENGRAFO_HOST}:${RUSTFS_PORT:-9000}
      S3_BUCKET: engrafo
      S3_TEXT_BUCKET: engrafo-text
      S3_ACCESS_KEY_ID: engrafo
      S3_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:?set RUSTFS_PASSWORD — openssl rand -hex 24}
      # On a LAN you control, set SECURE_LOCAL_NET=true and entering an address
      # signs you in — no link to dig out of the log. It makes that address the
      # entire credential, so it is wrong the moment this port is reachable from
      # anywhere you do not control.
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
      # "memory" signs everyone out when the container restarts; "database" does not.
      SESSION_STORE: ${SESSION_STORE:-memory}
      # Behind a reverse proxy, the number of proxies in front (usually 1).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Sign-in through an OIDC provider. Empty leaves it off.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      # OCR is on. It is CPU-bound: raise OCR_CONCURRENCY only if this machine
      # has cores to spare. Extra languages need their Tesseract data in the
      # image, so `eng` is what this one can do.
      OCR_ENABLED: "true"
      OCR_LANGUAGES: eng
      OCR_CONCURRENCY: "1"
      TZ: ${TZ:-UTC}
      NODE_ENV: production
    ports:
      - "${ENGRAFO_PORT:-3004}:3004"
    # No healthcheck block: the image ships its own, on /healthz.

  postgres:
    # pgvector's build of Postgres 17, for document search. Replaces
    # postgres:17-alpine on the same volume; Engrafo rebuilds its indexes on the
    # first boot after the switch, since the two order text differently.
    image: pgvector/pgvector:pg17
    container_name: engrafo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: engrafo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: engrafo
      TZ: ${TZ:-UTC}
    # No published port: only the container beside it needs the database.
    volumes:
      - engrafo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engrafo -d engrafo"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: engrafo-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: engrafo
      RUSTFS_SECRET_KEY: ${RUSTFS_PASSWORD:?set RUSTFS_PASSWORD — openssl rand -hex 24}
      RUSTFS_CONSOLE_ENABLE: "true"
      # Lets the Engrafo page, on one port, upload to RustFS, on another. A
      # signed link is the credential, so it does not matter which page uses it.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      # Empty means the container log, where `docker logs` and Portainer look.
      RUSTFS_OBS_LOG_DIRECTORY: ""
      TZ: ${TZ:-UTC}
    ports:
      # This one has to be reachable from your browser: uploads and downloads
      # go straight here, not through Engrafo.
      - "${RUSTFS_PORT:-9000}:9000"
      # RustFS's own admin console — handy for seeing your files, and it takes
      # the root password, so drop this line if you do not want it exposed.
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - engrafo_rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the two buckets and exits: one for the files you upload, one for the
  # text Engrafo extracts from them. Runs again on every `up`, and does nothing
  # when they already exist.
  rustfs-init:
    image: rustfs/rc:latest
    container_name: engrafo-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_PASSWORD: ${RUSTFS_PASSWORD:?set RUSTFS_PASSWORD — openssl rand -hex 24}
    entrypoint: >
      sh -c "rc alias set local http://rustfs:9000 engrafo \"$$RUSTFS_PASSWORD\" &&
             rc bucket create --ignore-existing local/engrafo &&
             rc bucket create --ignore-existing local/engrafo-text"
    restart: "no"

# Your documents live in engrafo_rustfs and their metadata in engrafo_pgdata.
# Both survive `docker compose down` and stack restarts — back up both together,
# because one without the other is not a working archive.
volumes:
  engrafo_pgdata:
  engrafo_rustfs:
