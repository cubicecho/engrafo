# The deployment: the app, its database and its object store.
# `docker compose up --build`.
name: engrafo

services:
  engrafo:
    image: vantreeseba/engrafo:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # Required — generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — generate one with `openssl rand -hex 32`}
      DATABASE_URL: postgres://engrafo:${POSTGRES_PASSWORD:-engrafo}@postgres:5432/engrafo
      APP_URL: ${APP_URL:-http://localhost:3004}
      S3_ENDPOINT: http://minio:9000
      # What the browser uploads to and downloads from. Presigned URLs are signed
      # for this host, so it must be the address users actually reach MinIO at.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: engrafo
      S3_ACCESS_KEY_ID: engrafo
      S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD is required — at least 8 characters}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_DEFAULT: ${OCR_DEFAULT:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      AUTH_MAGIC_LINK: ${AUTH_MAGIC_LINK:-true}
      EXPOSE_MAGIC_LINK: ${EXPOSE_MAGIC_LINK:-false}
      NODE_ENV: production
      PORT: 3004
    ports:
      - "${PORT:-3004}:3004"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: engrafo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engrafo}
      POSTGRES_DB: engrafo
    # No `ports`: the database is for the app beside it on the compose network.
    volumes:
      - engrafo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engrafo -d engrafo"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: engrafo
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required — at least 8 characters}
    # Published because browsers upload to it directly. The console stays on
    # loopback.
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - engrafo_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD is required — at least 8 characters}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 engrafo \"$$MINIO_PASSWORD\" &&
             mc mb --ignore-existing local/engrafo local/engrafo-text"
    restart: "no"

volumes:
  engrafo_pgdata:
  engrafo_minio:
