# The deployment: the app, its database and its object store.
# `docker compose up --build`.
name: engrafo

services:
  engrafo:
    image: vantreeseba/engrafo:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      # Required — generate with: openssl rand -hex 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required — generate one with `openssl rand -hex 32`}
      DATABASE_URL: postgres://engrafo:${POSTGRES_PASSWORD:-engrafo}@postgres:5432/engrafo
      APP_URL: ${APP_URL:-http://localhost:3004}
      S3_ENDPOINT: http://rustfs:9000
      # What the browser uploads to and downloads from. Presigned URLs are signed
      # for this host, so it must be the address users actually reach RustFS at.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: engrafo
      S3_ACCESS_KEY_ID: engrafo
      S3_SECRET_ACCESS_KEY: ${RUSTFS_PASSWORD:?RUSTFS_PASSWORD is required — generate one with `openssl rand -hex 24`}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_DEFAULT: ${OCR_DEFAULT:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
      EXPOSE_MAGIC_LINK: ${EXPOSE_MAGIC_LINK:-false}
      SESSION_STORE: ${SESSION_STORE:-memory}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: production
      PORT: 3004
    ports:
      - "${PORT:-3004}:3004"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: engrafo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engrafo}
      POSTGRES_DB: engrafo
    # No `ports`: the database is for the app beside it on the compose network.
    volumes:
      - engrafo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engrafo -d engrafo"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: engrafo
      RUSTFS_SECRET_KEY: ${RUSTFS_PASSWORD:?RUSTFS_PASSWORD is required — generate one with `openssl rand -hex 24`}
      RUSTFS_CONSOLE_ENABLE: "true"
      # RustFS sends no CORS headers unless told to, and a presigned browser PUT
      # is cross-origin by construction: the page is on one port, the bucket on
      # another. The signed URL is the credential, so any origin may use one.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      # Empty means stdout. The image's default is a file inside the container,
      # where `docker logs` shows nothing and nothing rotates it.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    # Published because browsers upload to it directly. The console stays on
    # loopback.
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - engrafo_rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_PASSWORD: ${RUSTFS_PASSWORD:?RUSTFS_PASSWORD is required — generate one with `openssl rand -hex 24`}
    entrypoint: >
      sh -c "rc alias set local http://rustfs:9000 engrafo \"$$RUSTFS_PASSWORD\" &&
             rc bucket create --ignore-existing local/engrafo &&
             rc bucket create --ignore-existing local/engrafo-text"
    restart: "no"

volumes:
  engrafo_pgdata:
  engrafo_rustfs:
